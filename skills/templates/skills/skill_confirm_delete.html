<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer une compétence</title>
</head>
<body>
    <h1>Supprimer une compétence</h1>

    <p>Voulez-vous vraiment supprimer « {{ skill.name }} » ?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Confirmer la suppression</button>
    </form>

    <a href="{% url 'skill_list' %}">Annuler</a>
</body>
</html>
